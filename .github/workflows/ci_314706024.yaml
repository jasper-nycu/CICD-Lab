name: CI/CD Homework

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() && !env.ACT
        with:
          report_paths: 'reports/vitest-junit.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload test report artifact
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: error
