name: Run Tests

on:
    push:
        branches:
            - "**"
    pull_request:

# Define permissions required for publishing test results to UI
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            # Added 'github-actions' reporter to generate inline code annotations on failure
            - name: Run tests
              run: |
                  mkdir -p reports
                  npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/vitest-junit.xml

            # Parse JUnit XML and display it on the GitHub Actions Summary and Checks tab
            - name: Publish Test Report
              uses: mikepenz/action-junit-report@v4
              if: always() && !env.ACT # Ensure this runs even if the tests fail and skip when running in local ACT environment
              with:
                  report_paths: 'reports/vitest-junit.xml'
                  detailed_summary: true
                  include_passed: true

            - name: Upload test report artifact
              if: always() && !env.ACT  # Ensure this runs even if the tests fail and skip when running in local ACT environment
              uses: actions/upload-artifact@v4
              with:
                  name: test-report
                  path: reports/
                  if-no-files-found: error